<!doctype html><html lang=ru><head><meta charset=UTF-8><meta name=viewport content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1"><meta http-equiv=X-UA-Compatible content="ie=edge"><title>HelpDesk</title><script defer src=/http/app.js></script><link href=/http/app.css rel=stylesheet></head><body><main class=help-desk><button class=help-desk__button type=button>Добавить тикет</button><ul class=help-desk__tickets></ul><form class="ticket-form ticket-form--add" hidden><h2 class=ticket-form__title>Добавить тикет</h2><div class=ticket-form__field><label for=ticket-name>Краткое описание <input id=ticket-name name=name required></label></div><div class=ticket-form__field><label for=ticket-description>Подробное описание <textarea id=ticket-description name=description></textarea></label></div><div class=ticket-form__actions><button class="ticket-form__button ticket-form__button--cancel" type=button>Отмена</button> <button class="ticket-form__button ticket-form__button--submit" type=submit>Ок</button></div><p class=ticket-form__error hidden></form><form class="ticket-form ticket-form--edit" hidden><h2 class=ticket-form__title>Изменить тикет</h2><div class=ticket-form__field><label for=edit-ticket-name>Краткое описание <input id=edit-ticket-name name=name required></label></div><div class=ticket-form__field><label for=edit-ticket-description>Подробное описание <textarea id=edit-ticket-description name=description></textarea></label></div><div class=ticket-form__actions><button class="ticket-form__button ticket-form__button--cancel" type=button>Отмена</button> <button class="ticket-form__button ticket-form__button--submit" type=submit>Сохранить</button></div><p class=ticket-form__error hidden></form><form class="ticket-form ticket-form--remove" hidden><h2 class=ticket-form__title>Удалить тикет</h2><p class=ticket-form__description>Вы уверены, что хотите удалить тикет? Это действие необратимо.<div class=ticket-form__actions><button class="ticket-form__button ticket-form__button--cancel" type=button>Отмена</button> <button class="ticket-form__button ticket-form__button--submit" type=submit>Ок</button></div><p class=ticket-form__error hidden></form></main></body></html>
